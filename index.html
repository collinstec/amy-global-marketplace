<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian — Projects & Goals</title>
  <meta name="description" content="Meridian organizes your projects and the goals they serve." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2316161a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23a5b4fc' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div>
          <div class="brand-name">Meridian</div>
          <div class="brand-sub">Projects &amp; Goals</div>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-section">
        <div class="sidebar-label">Active projects</div>
        <div id="sidebar-projects" class="sidebar-projects"></div>
      </div>

      <div class="sidebar-footer">
        <button class="ghost-btn" data-action="export" title="Back up your data"><span data-icon="download"></span>Export</button>
        <button class="ghost-btn" data-action="import" title="Restore from a backup file"><span data-icon="upload"></span>Import</button>
        <button class="ghost-btn" data-action="toggle-theme" title="Toggle light / dark"><span data-icon="theme"></span><span id="theme-label">Theme</span></button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>
    </aside>

    <div class="scrim" data-action="close-sidebar"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="open-sidebar" aria-label="Open menu"><span data-icon="menu"></span></button>
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Search projects and goals…" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <div class="topbar-actions">
          <button class="btn btn-secondary" data-action="new-goal"><span data-icon="target"></span><span class="hide-sm">New goal</span></button>
          <button class="btn btn-primary" data-action="new-project"><span data-icon="plus"></span><span class="hide-sm">New project</span></button>
        </div>
      </header>

      <section class="view" id="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
